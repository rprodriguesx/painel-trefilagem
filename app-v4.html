<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trefilagem | Painel por máquina</title>
<style>
:root{--bg:#101713;--panel:#1d2821;--panel2:#25342b;--line:#3e5145;--text:#f3f6f2;--muted:#a6b6ab;--mint:#a9d5b5;--green:#4ee18e;--red:#ff6969;--gold:#ffd061}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#203b31 0,transparent 29%),var(--bg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:26px 20px 48px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:25px;margin:0 0 6px}.sub{color:var(--muted);font-size:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:700;padding:10px 13px;cursor:pointer}.btn.primary{background:var(--mint);color:#132218;border-color:var(--mint)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.tab{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#1e2c24,#17201b);padding:14px;color:var(--muted);text-align:left;cursor:pointer;font-weight:800;font-size:16px}.tab small{display:block;font-size:11px;font-weight:500;margin-top:4px}.tab.active{background:linear-gradient(135deg,#b3ddbe,#679b75);border-color:#b3ddbe;color:#112016}.panel{background:linear-gradient(145deg,#233129,#18221c);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 14px 35px #05090533}.machine-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.machine-head h2{font-size:26px;margin:0 0 4px}.status{border:0;border-radius:18px;padding:8px 11px;font-weight:800;font-size:12px}.status.running{background:#154b2c;color:#a9ffca;animation:greenPulse 1.2s ease-in-out infinite}.status.stopped{background:#642a2a;color:#ffd1d1;animation:redPulse 1.2s ease-in-out infinite}.status.setup{background:#5c4920;color:#ffe5a1}@keyframes greenPulse{50%{box-shadow:0 0 0 7px #4ee18e1e,0 0 18px #4ee18e;transform:scale(1.025)}}@keyframes redPulse{50%{box-shadow:0 0 0 7px #ff69691e,0 0 18px #ff6969;transform:scale(1.025)}}.diameter{margin:16px 0;width:100%;background:#17211b;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:10px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.produce{color:#80f6af}.stop{color:#ff9c9c}.setup{color:#ffe08b}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.kpi{background:#17211b;border-radius:11px;padding:11px}.kpi span{display:block;color:var(--muted);font-size:11px}.kpi b{display:block;font-size:18px;margin-top:6px}.dash{display:grid;grid-template-columns:1.35fr .9fr;gap:14px;margin-top:16px}.chart{min-height:235px;background:linear-gradient(135deg,#1e3b2d,#1b243c 65%,#472d48);border-radius:13px;padding:15px;position:relative;overflow:hidden}.chart h3,.check h3,.occ h3{font-size:15px;margin:0 0 6px}.chart small{color:#c5d4ca}.bars{height:145px;display:flex;align-items:end;justify-content:space-around;gap:8px;margin-top:17px;border-bottom:1px solid #91a89b4d}.barcol{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:7px;color:#d4e1d8;font-size:10px}.bar{width:min(36px,100%);border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,#90f9c2,#5c80ff);box-shadow:0 0 20px #74edb044;min-height:3px}.chart .caption{font-size:11px;color:#d1e1d6;margin-top:10px}.check,.occ{margin-top:14px}.task{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #ffffff0d}.task:last-child{border:0}.task input{accent-color:#4ee18e;width:16px;height:16px}.task.done span{text-decoration:line-through;color:var(--muted)}.task button,.delete{margin-left:auto;background:transparent;border:0;color:#ffaaa4;cursor:pointer;font-size:11px}.add{border:0;background:transparent;color:var(--mint);padding:10px 0 0;cursor:pointer;font-weight:700}.event{padding:10px 0;border-bottom:1px solid #ffffff14}.event:last-child{border:0}.event b{font-size:12px}.event small{display:block;color:var(--muted);margin-top:3px}.tag{border-radius:12px;padding:4px 7px;font-size:10px;margin-left:7px}.tag.break{background:#5c4920;color:#ffe29b}.tag.fault{background:#642a2a;color:#ffc5c5}.empty{padding:16px 0;color:var(--muted);text-align:center}.modal{display:none;position:fixed;inset:0;background:#0009;place-items:center;padding:15px}.modal.open{display:grid}.dialog{width:min(480px,100%);padding:20px;background:#1e2922;border:1px solid var(--line);border-radius:16px}.dialog h3{margin:0 0 14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}input,select,textarea{background:#152019;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text)}textarea{min-height:70px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:720px){.wrap{padding:17px 12px}.top{flex-direction:column}h1{font-size:21px}.kpis{grid-template-columns:1fr 1fr}.dash{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.tab{padding:12px 8px;font-size:14px}.buttons .btn{font-size:12px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Trefilagem | Centro de Controlo</h1><div class="sub">Turno 01:10–09:10 · <span id="date"></span> · Dados guardados neste navegador</div></div><div class="buttons"><button class="btn" onclick="exportCsv()">Exportar CSV</button><button class="btn" onclick="window.print()">Exportar PDF</button><button class="btn primary" onclick="openProd()">+ Registar produção</button></div></header><nav id="tabs" class="tabs"></nav><section id="machine"></section></main>
<div class="modal" id="prodModal"><div class="dialog"><h3>Registar produção</h3><div class="form"><div class="field"><label>Máquina</label><select id="pm" onchange="syncProducts()"></select></div><div class="field"><label>Diâmetro</label><select id="pp"></select></div><div class="field"><label>Quilómetros</label><input id="km" type="number" min="0" step="0.01"></div><div class="field"><label>Hora</label><input id="ptime" type="datetime-local"></div><div class="field full"><label>Observação</label><input id="pnote"></div></div><div class="dialog-actions"><button class="btn" onclick="closeModal('prodModal')">Cancelar</button><button class="btn primary" onclick="saveProd()">Guardar</button></div></div></div>
<div class="modal" id="issueModal"><div class="dialog"><h3>Registar ocorrência</h3><div class="form"><div class="field"><label>Tipo</label><select id="type"><option>Quebra</option><option>Avaria</option><option>Setup</option><option>Aguardando material</option></select></div><div class="field"><label>Hora</label><input id="itime" type="datetime-local"></div><div class="field full"><label>Descrição / motivo</label><textarea id="reason"></textarea></div></div><div class="dialog-actions"><button class="btn" onclick="closeModal('issueModal')">Cancelar</button><button class="btn primary" onclick="saveIssue()">Guardar ocorrência</button></div></div></div>
<script>
const KEY='wire-dashboard-test-v3', PRODUCTS={TR2:['0,26 mm','0,40 mm'],TR5:['0,50 mm'],TR7:['0,26 mm']};let selected=localStorage.getItem('wire-machine-tab')||'TR2';function base(){return{m:{TR2:{s:'Sem dados',p:'0,26 mm',since:null},TR5:{s:'Sem dados',p:'0,50 mm',since:null},TR7:{s:'Sem dados',p:'0,26 mm',since:null}},prod:[],events:[],checks:{},tasks:['Colocar água','Fazer os registros','Retirar sucata','Limpar a área','Verificar a máquina']}}function load(){try{return {...base(),...JSON.parse(localStorage.getItem(KEY))}}catch{return base()}}let d=load();function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function now(){return new Date().toISOString()}function localTime(){let x=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return x.toISOString().slice(0,16)}function date(v){return v?new Date(v).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}function km(n){return d.prod.filter(x=>x.m===n).reduce((a,x)=>a+Number(x.km||0),0)}function duration(a,b){if(!a||!b)return'—';let m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));return Math.floor(m/60)+' h '+m%60+' min'}function state(n){let s=d.m[n].s;if(s==='Em produção')return'<span class="status running">● Em produção</span>';if(s==='Parada')return'<span class="status stopped">● Parada</span>';if(s==='Setup')return'<span class="status setup">● Setup</span>';return'<span class="status">Sem dados</span>'}function period(n){let e=d.events.filter(x=>x.m===n&&x.end);let total=e.reduce((a,x)=>a+Math.max(0,new Date(x.end)-new Date(x.time)),0);return total?Math.round(total/60000)+' min':'—'}function bars(n){let h=Array(8).fill(0),start=new Date();start.setHours(1,10,0,0);d.prod.filter(x=>x.m===n).forEach(x=>{let i=Math.floor((new Date(x.time)-start)/3600000);if(i>=0&&i<8)h[i]+=Number(x.km)});let max=Math.max(...h,1);return h.map((v,i)=>'<div class="barcol"><div class="bar" style="height:'+(v?Math.max(7,v/max*120):3)+'px"></div><span>'+String((i+1)%24).padStart(2,'0')+'h</span></div>').join('')}function taskList(n){d.checks[n]=d.checks[n]||{};return d.tasks.map((t,i)=>'<label class="task '+(d.checks[n][t]?'done':'')+'"><input type="checkbox" '+(d.checks[n][t]?'checked':'')+' onchange="toggleTask('+i+',this.checked)"><span>'+esc(t)+'</span><button type="button" onclick="deleteTask('+i+')">Apagar</button></label>').join('')}function events(n){let x=d.events.filter(e=>e.m===n).slice().reverse().slice(0,5);return x.length?x.map(e=>'<div class="event"><b>'+esc(e.kind)+'</b><span class="tag '+(e.kind==='Quebra'?'break':e.kind==='Avaria'?'fault':'')+'">'+date(e.time)+'</span><button class="delete" onclick="deleteEvent(\''+e.id+'\')">Apagar</button><small>'+esc(e.reason||'')+(e.end?' · '+duration(e.time,e.end):'')+'</small></div>').join(''):'<div class="empty">Sem ocorrências registadas.</div>'}function render(){let x=d.m[selected],last=d.events.filter(e=>e.m===selected).at(-1),done=Object.values(d.checks[selected]||{}).filter(Boolean).length;document.getElementById('tabs').innerHTML=Object.keys(PRODUCTS).map(n=>'<button class="tab '+(n===selected?'active':'')+'" onclick="selectMachine(\''+n+'\')">'+n+'<small>'+d.m[n].s+'</small></button>').join('');document.getElementById('machine').innerHTML='<article class="panel"><div class="machine-head"><div><h2>'+selected+'</h2><div class="sub">Painel individual da máquina</div></div>'+state(selected)+'</div><select class="diameter" onchange="changeDiameter(this.value)">'+PRODUCTS[selected].map(p=>'<option '+(p===x.p?'selected':'')+'>'+p+'</option>').join('')+'</select><div class="kpis"><div class="kpi"><span>Produção registada</span><b>'+ (km(selected)?km(selected).toLocaleString('pt-PT')+' km':'—')+'</b></div><div class="kpi"><span>Início de produção</span><b>'+date(x.since)+'</b></div><div class="kpi"><span>Tempo parado</span><b>'+period(selected)+'</b></div><div class="kpi"><span>Última ocorrência</span><b>'+esc(last?.kind||'—')+'</b></div></div><div class="actions"><button class="btn produce" onclick="start()">▶ Produzindo</button><button class="btn stop" onclick="openIssue()">● Avaria / quebra</button><button class="btn setup" onclick="quickSetup()">Setup</button></div></article><div class="dash"><div class="panel chart"><h3>Produção por hora</h3><small>Quilómetros lançados no turno — '+selected+'</small><div class="bars">'+bars(selected)+'</div><div class="caption">O gráfico cresce conforme os lançamentos de produção são registados.</div></div><div class="panel occ"><h3>Ocorrências — '+selected+'</h3>'+events(selected)+'</div></div><div class="dash"><div class="panel check"><h3>Checklist diário</h3><div class="sub">'+done+'/'+d.tasks.length+' atividades concluídas</div>'+taskList(selected)+'<button class="add" onclick="addTask()">+ Adicionar atividade</button></div><div class="panel"><h3>Estado atual</h3><div class="empty">O indicador fica <b style="color:#74ef9f">verde pulsando</b> durante produção e <b style="color:#ff9494">vermelho pulsando</b> quando a máquina está parada.</div></div></div>'}function selectMachine(n){selected=n;localStorage.setItem('wire-machine-tab',n);render()}function changeDiameter(v){d.m[selected].p=v;save()}function start(){let time=now();d.events.filter(e=>e.m===selected&&!e.end&&e.kind!=='Início de produção').forEach(e=>e.end=time);d.m[selected].s='Em produção';d.m[selected].since=time;d.events.push({id:crypto.randomUUID(),m:selected,kind:'Início de produção',time,reason:'Início registado pelo botão Produzindo'});save()}function openProd(){document.getElementById('pm').innerHTML=Object.keys(PRODUCTS).map(n=>'<option '+(n===selected?'selected':'')+'>'+n+'</option>').join('');syncProducts();document.getElementById('km').value='';document.getElementById('ptime').value=localTime();document.getElementById('pnote').value='';document.getElementById('prodModal').classList.add('open')}function syncProducts(){let n=document.getElementById('pm').value;document.getElementById('pp').innerHTML=PRODUCTS[n].map(p=>'<option>'+p+'</option>').join('')}function saveProd(){let amount=Number(document.getElementById('km').value);if(!(amount>0))return alert('Informe os quilómetros produzidos.');let n=document.getElementById('pm').value;d.prod.push({id:crypto.randomUUID(),m:n,p:document.getElementById('pp').value,km:amount,time:new Date(document.getElementById('ptime').value||Date.now()).toISOString(),note:document.getElementById('pnote').value});d.m[n].p=document.getElementById('pp').value;closeModal('prodModal');save()}function openIssue(){document.getElementById('type').value='Quebra';document.getElementById('itime').value=localTime();document.getElementById('reason').value='';document.getElementById('issueModal').classList.add('open')}function quickSetup(){openIssue();document.getElementById('type').value='Setup'}function saveIssue(){let kind=document.getElementById('type').value,reason=document.getElementById('reason').value.trim();if(!reason)return alert('Descreva o ocorrido.');let time=new Date(document.getElementById('itime').value||Date.now()).toISOString();d.events.push({id:crypto.randomUUID(),m:selected,kind,time,reason,end:null});d.m[selected].s=kind==='Setup'?'Setup':'Parada';closeModal('issueModal');save()}function closeModal(id){document.getElementById(id).classList.remove('open')}function toggleTask(i,on){let t=d.tasks[i];d.checks[selected]=d.checks[selected]||{};d.checks[selected][t]=on;save()}function addTask(){let t=prompt('Qual atividade deseja adicionar?');if(t?.trim()){d.tasks.push(t.trim());save()}}function deleteTask(i){if(!confirm('Apagar esta atividade do checklist?'))return;let t=d.tasks[i];d.tasks.splice(i,1);Object.values(d.checks).forEach(c=>delete c[t]);save()}function deleteEvent(id){if(!confirm('Apagar este registo?'))return;d.events=d.events.filter(e=>e.id!==id);save()}function exportCsv(){let r=['Tipo;Data;Máquina;Diâmetro;Descrição;Km'];d.events.forEach(e=>r.push([e.kind,date(e.time),e.m,e.p||d.m[e.m].p,(e.reason||'').replaceAll(';',','),''].join(';')));d.prod.forEach(p=>r.push(['Produção',date(p.time),p.m,p.p,(p.note||'').replaceAll(';',','),p.km].join(';')));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));a.download='trefilagem.csv';a.click()}document.getElementById('date').textContent=new Date().toLocaleDateString('pt-PT');render();
</script><script>
/* Linha do turno: alto = produzindo, baixo = parada. */
(()=>{const oldRender=render,oldOpenProd=openProd,oldSaveProd=saveProd;
function shiftTimes(){let start=new Date();start.setHours(1,10,0,0);let end=new Date(start.getTime()+8*3600000),nowTime=new Date();return{start,end,limit:nowTime<end?nowTime:end}}
function timeline(machine){let {start,end,limit}=shiftTimes(),events=d.events.filter(e=>e.m===machine).slice().sort((a,b)=>new Date(a.time)-new Date(b.time)),running=false,at=start.getTime(),up=0,down=0,points=[[0,142]];for(const e of events){let t=Math.max(start.getTime(),Math.min(limit.getTime(),new Date(e.time).getTime()));if(t<at)continue;if(running)up+=t-at;else down+=t-at;let x=(t-start)/(end-start)*100;points.push([x,running?42:142]);running=e.kind==='Início de produção'||e.kind==='Retoma de produção';points.push([x,running?42:142]);at=t}if(limit>at){if(running)up+=limit-at;else down+=limit-at;points.push([(limit-start)/(end-start)*100,running?42:142])}return{points,up,down,running}}
function fmt(ms){let m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function lineChart(machine){let t=timeline(machine),coords=t.points.map(p=>(p[0]*5.2+20).toFixed(1)+','+p[1]).join(' '),bobs=d.prod.filter(p=>p.m===machine).reduce((a,p)=>a+Number(p.bobs||0),0),marks=d.prod.filter(p=>p.m===machine).map(p=>{let {start,end}=shiftTimes(),x=Math.max(0,Math.min(100,(new Date(p.time)-start)/(end-start)*100))*5.2+20;return '<circle cx="'+x.toFixed(1)+'" cy="30" r="4" fill="#ffd061"/><text x="'+x.toFixed(1)+'" y="19" fill="#ffe7a5" text-anchor="middle" font-size="10">'+(p.bobs||1)+' B</text>'}).join('');return '<h3>Ritmo do turno</h3><small>Linha alta: produzindo · linha baixa: parada</small><div class="time-stats"><b>Produzindo: '+fmt(t.up)+'</b><b>Parada: '+fmt(t.down)+'</b><b>Bobinas: '+bobs+'</b></div><svg class="time-line" viewBox="0 0 560 170" preserveAspectRatio="none"><defs><linearGradient id="lineGrad" x1="0" x2="1"><stop stop-color="#4ee18e"/><stop offset=".55" stop-color="#79d4ff"/><stop offset="1" stop-color="#b77aff"/></linearGradient></defs><path d="M20 42 H540 M20 142 H540" stroke="#ffffff22" stroke-dasharray="4 7"/><polyline points="'+coords+'" fill="none" stroke="url(#lineGrad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>'+marks+'<text x="20" y="165" fill="#cfe0d5" font-size="10">01:10</text><text x="500" y="165" fill="#cfe0d5" font-size="10">09:10</text></svg><div class="caption">A linha acompanha automaticamente cada início de produção e cada paragem registada.</div>'}
function enhance(){let chart=document.querySelector('#machine .chart');if(chart)chart.innerHTML=lineChart(selected);let boxes=document.querySelectorAll('#machine .kpi');if(boxes.length>2){let t=timeline(selected);boxes[2].innerHTML='<span>Tempo parado</span><b>'+fmt(t.down)+'</b>';boxes[3].innerHTML='<span>Tempo produtivo</span><b>'+fmt(t.up)+'</b>'}}
render=function(){oldRender();enhance()};
openProd=function(){oldOpenProd();let f=document.querySelector('#prodModal .form'),kmField=document.getElementById('km').closest('.field');if(!document.getElementById('bobs'))kmField.insertAdjacentHTML('afterend','<div class="field"><label>Bobinas feitas</label><input id="bobs" type="number" min="0" step="1" value="0"></div>');else document.getElementById('bobs').value='0'};
saveProd=function(){let b=Number(document.getElementById('bobs')?.value||0);oldSaveProd();if(d.prod.length){d.prod.at(-1).bobs=b;localStorage.setItem(KEY,JSON.stringify(d));render()}};
let st=document.createElement('style');st.textContent='.time-stats{display:flex;gap:9px;flex-wrap:wrap;margin:11px 0}.time-stats b{font-size:11px;padding:6px 8px;border-radius:8px;background:#10271f;color:#d9f4e2}.time-line{width:100%;height:145px;margin-top:3px;overflow:visible}.chart{min-height:255px!important;background:#162c2e!important}.chart .caption{margin-top:2px!important}@media(max-width:600px){.time-stats b{font-size:10px}}';document.head.append(st);render()})();
</script><script>
/* Metas de produção confirmadas pelo operador. */
