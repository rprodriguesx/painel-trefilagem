<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard de Trefilagem</title><style>
:root{--bg:#f4f7fc;--white:#fff;--ink:#1b2740;--muted:#8190a9;--line:#e7edf5;--blue:#4b9cff;--purple:#7862ee;--green:#24b987;--red:#ef6879;--shadow:0 14px 35px #314c7514}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e8edff,transparent 35%),var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{display:flex;min-height:100vh}.side{width:220px;background:#fff;border-right:1px solid var(--line);padding:27px 18px}.brand{font-weight:800;font-size:18px;margin:0 0 40px;padding:0 12px;color:#2e5bb7}.brand span{color:#65a9ff}.nav button{display:block;width:100%;padding:12px 15px;margin:7px 0;border:0;border-radius:10px;background:transparent;text-align:left;color:#8793aa;cursor:pointer}.nav button.active{background:#edf4ff;color:#397ee7;font-weight:700}.nav button i{font-style:normal;margin-right:10px}.main{max-width:1300px;width:100%;padding:31px 38px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{font-size:11px;color:#5c91dc;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.title{margin:6px 0;font-size:29px}.sub{color:var(--muted);margin:0}.date{padding:11px 15px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:1.45fr .75fr;gap:20px}.card{background:rgba(255,255,255,.88);border:1px solid #e9eef6;border-radius:18px;padding:21px;box-shadow:var(--shadow)}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{flex:1;padding:12px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;font-weight:700;cursor:pointer}.tab.active{color:#fff;border:0;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 20px #5c8ffc35}.machine-head{display:flex;justify-content:space-between;align-items:start}.machine-head h2{margin:0;font-size:23px}.badge{padding:6px 10px;border-radius:20px;background:#e6faf3;color:#15996f;font-size:11px}.badge.stop{background:#fff0f2;color:#d64d61}.select{padding:10px;width:180px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:#f7f9fd;padding:14px;border-radius:12px}.stat b{display:block;font-size:21px;margin-top:5px}.stat small{color:var(--muted)}.chartbox{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcff}.charttitle{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.chart{width:100%;height:210px}.chart path.area{fill:url(#area)}.chart path.line{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.axis{display:flex;justify-content:space-between;color:#a4afc0;font-size:10px;margin:4px 8px 0}.right{display:grid;gap:20px;align-content:start}.focus{background:linear-gradient(145deg,#eef5ff,#faf9ff);min-height:190px}.focus h3{margin:0}.big{font-size:44px;font-weight:800;margin:22px 0 4px;color:#304c8d}.mini-chart{height:50px;margin-top:18px;background:linear-gradient(165deg,transparent 47%,#77aaff 49%,transparent 52%)}.event{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event small{display:block;color:var(--muted);margin-top:4px}.pill{font-size:10px;padding:5px 8px;border-radius:8px;background:#fff0f2;color:#d64d61;height:max-content}.actions{display:flex;gap:8px;margin-top:17px}.actions button{border:0;padding:10px 13px;border-radius:9px;cursor:pointer}.go{background:#e5faf2;color:#15996f}.stop{background:#fff0f2;color:#d64d61}.setup{background:#fff6df;color:#a7780b}@media(max-width:950px){.side{width:72px;padding:24px 10px}.brand{font-size:0;margin-bottom:35px}.brand span{font-size:22px}.nav button{font-size:0;text-align:center}.nav button i{margin:0;font-size:19px}.layout{grid-template-columns:1fr}}@media(max-width:600px){.main{padding:20px 13px}.header{align-items:start}.date{display:none}.title{font-size:24px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span>◈</span> TREFILAGEM</div><nav class="nav"><button class="active"><i>⌂</i>Dashboard</button><button onclick="showMachine('TR2')"><i>▦</i>Por máquina</button><button onclick="scrollTo(0,0)"><i>⌁</i>Produção</button><button><i>▣</i>Ocorrências</button><button><i>⚙</i>Configurações</button></nav></aside><main class="main"><header class="header"><div><div class="eyebrow">Linha de trefilagem</div><h1 class="title">Dashboard do turno</h1><p class="sub">01:10–09:10 · <span id="date"></span></p></div><div class="date">Atualizado agora</div></header><div class="layout"><section class="card"><div class="tabs"><button class="tab active" data-m="TR2" onclick="showMachine('TR2')">TR2</button><button class="tab" data-m="TR5" onclick="showMachine('TR5')">TR5</button><button class="tab" data-m="TR7" onclick="showMachine('TR7')">TR7</button></div><div id="machine"></div></section><aside class="right"><div class="card focus"><h3>Produtividade do turno</h3><div class="big" id="eff">78%</div><div class="muted">Eficiência estimada</div><div class="mini-chart"></div></div><div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">Últimas ocorrências</h3><span class="muted">Hoje</span></div><div id="events"></div></div></aside></div></main></div><script>
const cfg={TR2:{products:['0,26 mm','0,40 mm'],product:'0,26 mm',km:90200,state:'Produzindo',down:8,points:[12,19,14,29,48,41,61,75]},TR5:{products:['0,50 mm'],product:'0,50 mm',km:0,state:'Produzindo',down:8,points:[8,15,12,23,31,28,41,48]},TR7:{products:['0,26 mm'],product:'0,26 mm',km:91000,state:'Parada',down:24,points:[6,12,10,18,21,20,18,18]}},events=[];$('date').textContent=new Date().toLocaleDateString('pt-BR');function $(x){return document.getElementById(x)}function showMachine(n){let c=cfg[n];document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.m===n));$('machine').innerHTML=`<div class="machine-head"><div><h2>${n}</h2><p class="sub">Acompanhamento individual da máquina</p><select class="select" onchange="cfg['${n}'].product=this.value">${c.products.map(p=>`<option ${p===c.product?'selected':''}>${p}</option>`).join('')}</select></div><span class="badge ${c.state==='Parada'?'stop':''}">${c.state}</span></div><div class="stats"><div class="stat"><small>Produção registrada</small><b>${c.km.toLocaleString('pt-BR')} km</b></div><div class="stat"><small>Tempo parado</small><b>${c.down} min</b></div><div class="stat"><small>Bitola atual</small><b>${c.product}</b></div></div><div class="chartbox"><div class="charttitle"><span>Produção acumulada ao longo do turno</span><b>km</b></div><svg class="chart" viewBox="0 0 700 210" preserveAspectRatio="none"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#62adff" stop-opacity=".35"/><stop offset="1" stop-color="#62adff" stop-opacity="0"/></linearGradient></defs><path class="area" d="${area(c.points)}"/><path class="line" d="${line(c.points)}"/></svg><div class="axis"><span>01:10</span><span>03:10</span><span>05:10</span><span>07:10</span><span>09:10</span></div></div><div class="actions"><button class="go" onclick="setState('${n}','Produzindo')">Produzindo</button><button class="stop" onclick="setState('${n}','Parada')">Parada</button><button class="setup" onclick="setState('${n}','Setup')">Setup</button></div>`}function line(a){return a.map((v,i)=>`${i?'L':'M'} ${30+i*90} ${180-v*2}`).join(' ')}function area(a){return `${line(a)} L 660 195 L 30 195 Z`}function setState(n,s){cfg[n].state=s;showMachine(n)}function renderEvents(){$('events').innerHTML=events.length?events.map(e=>`<div class="event"><div><b>${e.n} · ${e.t}</b><small>${e.r}</small></div><span class="pill">${e.d} min</span></div>`).join(''):'<p class="muted">Nenhuma parada registrada.</p>'}showMachine('TR2');renderEvents();</script></body></html>
